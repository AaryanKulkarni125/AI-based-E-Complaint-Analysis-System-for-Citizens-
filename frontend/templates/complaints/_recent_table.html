<div class="table-wrap">
  <table>
    <thead><tr><th>Tracking ID</th><th>Location</th><th>Updated</th><th>Status</th></tr></thead>
    <tbody>
      {% for c in recent %}
        <tr>
          <td><a href="{% url 'complaints:detail' c.pk %}">{{ c.reference }}</a></td>
          <td>{{ c.location }}</td>
          <td>{{ c.updated_at|date:"j M Y, H:i" }}</td>
          <td><span class="badge badge-{{ c.status }}">{{ c.get_status_display }}</span></td>
        </tr>
      {% empty %}
        <tr><td colspan="4" class="empty">{{ empty_text }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
